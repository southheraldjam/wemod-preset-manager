  <circle cx="980" cy="250" r="46" fill="none" stroke="#3ddc97" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="230" cy="60" r="34" fill="none" stroke="#4f8cff" stroke-opacity="0.10" stroke-width="2"/>

  <line x1="80" y1="150" x2="1120" y2="150" stroke="url(#lineGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="268" x2="1120" y2="268" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4"/>

  <polyline points="60,200 140,200 160,180 190,220 220,200 300,200" fill="none" stroke="#3ddc97" stroke-opacity="0.18" stroke-width="2"/>
